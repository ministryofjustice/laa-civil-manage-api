services:
  civil-manage:
    build: ../../../.
    ports:
      - "3000:3000"

  zap-scan:
    image: zaproxy/zap-stable@sha256:2ec1d5d5b44d55cfd02ba9b89cd26852f06d92b7fc0ce9f064b9463babc73074
    command: zap.sh -cmd -port 9090 -autorun /zap/wrk/zap.yaml
    volumes:
      - ../../../.:/zap/wrk:rw
    links:
      - civil-manage