name: ZAP Security Scanning
on:
  pull_request:
    branches: [ "main" ]
  workflow_call:

jobs:
  zap-scan:
    # Required checks must report for every PR. Dependabot PRs report this job as skipped,
    # which GitHub treats as successful for branch protection, without running DAST.
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build JAR
        run: ./gradlew build -x test --no-daemon

      - name: Verify JAR exists
        run: |
          echo "Checking for JAR files..."
          JAR_FILE=$(find build/libs -name "laa-civil-manage-api-*.jar" | grep -v plain)
          
          if [ -z "$JAR_FILE" ]; then
            echo "JAR not found! Build may have failed."
            exit 1
          fi
          echo "Found JAR: $JAR_FILE"

      - name: Create tmp directory for ZAP reports
        run: |
          mkdir -p tmp
          chmod 777 tmp

      - name: Run Zap Security Scan against Civil Manage
        run: |
          chmod +x ./deploy/scripts/zap/zap-run-cicd.sh
          ./deploy/scripts/zap/zap-run-cicd.sh 

      - name: Upload ZAP HTML Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-scan-report-html
          path: tmp/zap-baseline-report.html