name: 'Build, Test, and Publish Gradle Project'
description: 'Checks out the code, sets up JDK 25 and Gradle, then builds and publishes.'

inputs:
  github_token:
    description: 'GitHub Token required for Gradle build and publish steps'
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Set up JDK 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: 25
        distribution: 'corretto'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c #v5.0.2

    - name: Build and test
      shell: bash
      run: ./gradlew build
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Verify that OpenAPI schema is up to date
      shell: bash
      run: ./gradlew verifyOpenApiSync
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
