name: Deploy to environment

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Github deployment environment"
        required: false
        default: "dev"
        type: choice
        options:
          - dev

permissions:
  contents: read
  id-token: write
  actions: read
  security-events: write
  pull-requests: write

jobs:
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/secret-detection@453d9818c2281d40fb9e2a7bdd143487978ccbec


  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build and Test JAR
        uses: ./.github/actions/build_and_test
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-jar
          path: build/libs/laa-civil-manage-api-0.0.1-SNAPSHOT.jar

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: build/reports/jacoco/jacoco.xml

  coverage:
    name: Code Coverage Report
    runs-on: ubuntu-latest
    needs:
      - build-and-test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download JaCoCo coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-report
          path: build/reports/jacoco

      - name: Publish coverage report to PR
        uses: madrapps/jacoco-report@50d3aff4548aa991e6753342d9ba291084e63848 # v1.7.2
        with:
          paths: build/reports/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 90
          min-coverage-changed-files: 0
          title: 'Code Coverage Report'
          pass-emoji: ':white_check_mark:'
          fail-emoji: ':x:'
          update-comment: true

  build-docker-image:
    name: Build Docker Image and Push to ECR
    runs-on: ubuntu-latest
    environment: dev
    needs:
      - build-and-test
      - secret-scan
    permissions:
      id-token: write
      contents: read
    outputs:
      image_uri: ${{ steps.build_and_push.outputs.image_uri }}
      image_registry: ${{ steps.build_and_push.outputs.image_registry }}
      image_repo: ${{ steps.build_and_push.outputs.image_repo }}
      image_tag: ${{ steps.build_and_push.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download JAR artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-jar
          path: build/libs

      - name: Set up AWS credentials for ECR
        if: github.actor != 'renovate[bot]'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.API_ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.API_ECR_REGION }}

      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        if: github.actor != 'renovate[bot]'
        id: login-ecr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push image
        id: build_and_push
        uses: ./.github/actions/docker_build_and_push
        with:
          image_registry: ${{ steps.login-ecr.outputs.registry || 'localhost' }}
          image_repo: ${{ vars.API_ECR_REPOSITORY }}
          dockerfile_path: Dockerfile
          image_tag: ${{ github.sha }}
          additional_tag: ${{ github.ref == 'refs/heads/main' && 'main' || '' }}
          push_image: ${{ github.actor != 'renovate[bot]' }}

  image-scan:
    name: Image Scan
    needs:
      - build-docker-image
    if: github.actor != 'renovate[bot]'
    uses: ministryofjustice/laa-reusable-github-actions/.github/workflows/sast.yml@df9a4a8ad625a391c27ccf81a1c1a2d7b23e6474
    permissions:
      id-token: write
      contents: read
      actions: read
      security-events: write
    with:
      image_uri: ${{ needs.build-docker-image.outputs.image_uri }}
      ecr_session_name: github-cicd-laa-civil-manage-api-scan-${{ github.run_number }}
    secrets:
      SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
      SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}
      ECR_ROLE_TO_ASSUME: ${{ secrets.API_ECR_ROLE_TO_ASSUME }}

  zap-scan:
    name: ZAP Security Scanning
    uses: ./.github/workflows/zap-scanning.yml
    needs:
      - build-docker-image
    # Only run tests when deploying to dev
    if: ${{ github.actor != 'renovate[bot]' && success() && (
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.environment == 'dev' ||
      github.event.inputs.environment == null
      ) }}

  # ==========================================
  # DEV DEPLOYMENT
  # ==========================================
  prepare_dev:
    name: Prepare Dev Environment
    if: github.actor != 'renovate[bot]' && !failure() && !cancelled()
    needs: build-docker-image
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.vars.outputs.release_name }}
      release_host: ${{ steps.vars.outputs.release_host }}
      identifier: ${{ steps.vars.outputs.identifier }}
    steps:
      - id: vars
        run: |
          APP_NAME="laa-civil-manage-api"
          ENVIRONMENT="dev"
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"

          if [ "${BRANCH_NAME}" == "main" ]; then
            RELEASE_NAME="${APP_NAME}"
            RELEASE_HOST="${APP_NAME}-${ENVIRONMENT}.cloud-platform.service.justice.gov.uk"
            IDENTIFIER="${APP_NAME}-green-${APP_NAME}-${ENVIRONMENT}-green"
          else
            RELEASE_NAME=$(echo "${BRANCH_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's:^\w*\/::' | tr -s ' _/[]().' '-' | cut -c1-18 | sed 's/-$//')
            RELEASE_HOST="${RELEASE_NAME}-${APP_NAME}-${ENVIRONMENT}.cloud-platform.service.justice.gov.uk"
            IDENTIFIER="${RELEASE_NAME}-green-${APP_NAME}-${ENVIRONMENT}-green"
          fi

          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_host=${RELEASE_HOST}" >> "$GITHUB_OUTPUT"
          echo "identifier=${IDENTIFIER}" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy to Dev
    needs: [prepare_dev, build-docker-image, image-scan]
    uses: ./.github/workflows/helm-deploy.yml
    with:
      environment: dev
      image_registry: ${{ needs.build-docker-image.outputs.image_registry }}
      image_repo: ${{ needs.build-docker-image.outputs.image_repo }}
      image_tag: ${{ needs.build-docker-image.outputs.image_tag }}
      helm_release_name: ${{ needs.prepare_dev.outputs.release_name }}
      helm_additional_args: >-
        --set certificate.enabled=false
        --set nameOverride="${{ needs.prepare_dev.outputs.release_name }}"
        --set-string ingress.green.hostname="${{ needs.prepare_dev.outputs.release_host }}"
        --set-string ingress.green.annotations."external-dns\.alpha\.kubernetes\.io/set-identifier"="${{ needs.prepare_dev.outputs.identifier }}"
    secrets: inherit

  notify_pr_dev:
    name: Post PR Notification
    if: github.event_name == 'pull_request' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    needs: [prepare_dev, deploy-dev]
    permissions:
      pull-requests: write
    steps:
      - name: Post deployment URL to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = `https://${{ needs.prepare_dev.outputs.release_host }}/swagger-ui/index.html`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Branch deployed to dev: [${url}](${url})`,
            });

  # ==========================================
  # STAGING DEPLOYMENT
  # ==========================================
  prepare_staging:
    name: Prepare Staging Environment
    if: github.actor != 'renovate[bot]' && !failure() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy-dev
    outputs:
      release_name: ${{ steps.vars.outputs.release_name }}
      release_host: ${{ steps.vars.outputs.release_host }}
      identifier: ${{ steps.vars.outputs.identifier }}
    steps:
      - id: vars
        run: |
          APP_NAME="laa-civil-manage-api"
          ENVIRONMENT="staging"
          RELEASE_NAME="${APP_NAME}"
          RELEASE_HOST="${APP_NAME}-${ENVIRONMENT}.cloud-platform.service.justice.gov.uk"
          IDENTIFIER="${APP_NAME}-green-${APP_NAME}-${ENVIRONMENT}-green"

          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_host=${RELEASE_HOST}" >> "$GITHUB_OUTPUT"
          echo "identifier=${IDENTIFIER}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy to Staging
    needs: [prepare_staging, build-docker-image, image-scan]
    uses: ./.github/workflows/helm-deploy.yml
    with:
      environment: staging
      image_registry: ${{ needs.build-docker-image.outputs.image_registry }}
      image_repo: ${{ needs.build-docker-image.outputs.image_repo }}
      image_tag: ${{ needs.build-docker-image.outputs.image_tag }}
      helm_release_name: ${{ needs.prepare_staging.outputs.release_name }}
      helm_additional_args: >-
        --set certificate.enabled=false
        --set nameOverride="${{ needs.prepare_staging.outputs.release_name }}"
        --set-string ingress.green.hostname="${{ needs.prepare_staging.outputs.release_host }}"
        --set-string ingress.green.annotations."external-dns\.alpha\.kubernetes\.io/set-identifier"="${{ needs.prepare_staging.outputs.identifier }}"
    secrets: inherit
