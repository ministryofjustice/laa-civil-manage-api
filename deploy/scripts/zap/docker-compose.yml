services:
  civil-manage:
    build: ../../../.
    ports:
      - "3000:3000"
    # Throwaway OAuth2 config so the app can start for scanning.
    # Real values come from Kubernetes namespace secrets in deployed envs.
    environment:
      AZURE_ENTRA_API_CLIENT_ID: zap-scan
      AZURE_ENTRA_API_CLIENT_SECRET: zap-scan

  zap-scan:
    image: zaproxy/zap-stable@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
    command: zap.sh -cmd -port 9090 -autorun /zap/wrk/zap.yaml
    volumes:
      - ../../../.:/zap/wrk:rw
    links:
      - civil-manage