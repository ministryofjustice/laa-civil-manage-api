name: Deploy to DEV and staging

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Github deployment environment"
        required: false
        default: "dev"
        type: choice
        options:
          - dev

permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build and Test JAR
        uses: ./.github/actions/build_and_test
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-jar
          path: build/libs/laa-civil-manage-api-0.0.1-SNAPSHOT.jar

  build-docker-image:
    name: Build Docker Image and Push to ECR
    runs-on: ubuntu-latest
    environment: dev
    needs:
      - build-and-test
    permissions:
      id-token: write
      contents: read
    outputs:
      image_uri: ${{ steps.build_and_push.outputs.image_uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download JAR artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-jar
          path: build/libs

      - name: Set up AWS credentials for ECR
        if: github.actor != 'renovate[bot]'
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.API_ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.API_ECR_REGION }}

      - uses: aws-actions/amazon-ecr-login@376925c9d111252e87ae59691e5a442dd100ef6a # v2.1.3
        if: github.actor != 'renovate[bot]'
        id: login-ecr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push image
        id: build_and_push
        uses: ./.github/actions/docker_build_and_push
        with:
          image_registry: ${{ secrets.ECR_REGISTRY_URL }}
          image_repo: ${{ vars.API_ECR_REPOSITORY }}
          dockerfile_path: Dockerfile
          image_tag: ${{ github.sha }}
          push_image: ${{ github.actor != 'renovate[bot]' }}

  image-scan:
    name: Image Scan
    needs:
      - build-docker-image
    if: github.actor != 'renovate[bot]'
    uses: ministryofjustice/laa-reusable-github-actions/.github/workflows/sast.yml@0cb7eb8ab4bf643986ab36ecf3ffcdffa9b55214
    permissions:
      id-token: write
      contents: read
      actions: read
      security-events: write
    with:
      image_uri: ${{ needs.build-docker-image.outputs.image_uri }}
      ecr_session_name: github-cicd-laa-civil-manage-api-scan-${{ github.run_number }}
    secrets: inherit

  zap-scan:
    name: ZAP Security Scanning
    uses: ./.github/workflows/zap-scanning.yml
    needs:
      - build-docker-image
    # Only run tests when deploying to dev
    if: ${{ github.actor != 'renovate[bot]' && success() && (
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.environment == 'dev' ||
      github.event.inputs.environment == null
      ) }}

  deploy-dev:
    if: ${{ github.actor != 'renovate[bot]' && !failure() && !cancelled() }}
    environment: dev
    runs-on: ubuntu-latest
    needs:
      - build-docker-image
      - image-scan
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Deploy to dev
        id: deploy_dev
        uses: ./.github/actions/deploy
        with:
          app-environment: dev
          ecr-repository: ${{ vars.API_ECR_REPOSITORY }}
          ecr-registry_url: ${{ secrets.ECR_REGISTRY_URL }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}

      - name: Post deployment URL to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = `${{ steps.deploy_dev.outputs.release_url }}/swagger-ui/index.html`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Branch deployed to dev: [${url}](${url})`,
            });

  deploy-staging:
    if: ${{ github.actor != 'renovate[bot]' && !failure() && !cancelled() && github.ref == 'refs/heads/main' }}
    environment: staging
    runs-on: ubuntu-latest
    needs:
      - build-docker-image
      - image-scan

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Deploy to staging
        uses: ./.github/actions/deploy
        with:
          app-environment: staging
          ecr-repository: ${{ vars.API_ECR_REPOSITORY }}
          ecr-registry_url: ${{ secrets.ECR_REGISTRY_URL }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
