          jwk-set-uri: https://login.microsoftonline.com/8352c342-da15-413a-8b5b-d89545766f0c/discovery/v2.0/keys
          audiences:
            - efb49b90-5365-456f-bc87-c5a613e0d08d
            - 024c9bb4-b5fd-434b-abff-1d7d7c8776f4
      client:
