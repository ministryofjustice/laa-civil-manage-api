name: 'Build, Test, and Publish Gradle Project'
description: 'Checks out the code, sets up JDK 25 and Gradle, then builds and publishes.'

inputs:
  github_token:
    description: 'GitHub Token required for Gradle build and publish steps'
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up JDK 25
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: 25
        distribution: 'corretto'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c #v5.0.2

    - name: Build and test
      shell: bash
      run: ./gradlew build
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Verify that OpenAPI schema is up to date
      shell: bash
      run: ./gradlew verifyOpenApiSync
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
