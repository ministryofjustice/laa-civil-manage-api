spring:
  application:
    name: laa-civil-manage-api

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_ENTRA_TENANT_ID:}/v2.0
          jwk-set-uri: https://login.microsoftonline.com/${AZURE_ENTRA_TENANT_ID:}/discovery/v2.0/keys
          audiences:
            - ${AZURE_ENTRA_API_AUDIENCE:}
            - ${AZURE_ENTRA_API_CLIENT_ID:}
      client:
        registration:
          entra-obo-access-data-store:
            provider: azure-entra
            client-id: ${AZURE_ENTRA_API_CLIENT_ID:}
            client-secret: ${AZURE_ENTRA_API_CLIENT_SECRET:}
            authorization-grant-type: urn:ietf:params:oauth:grant-type:jwt-bearer
            scope:
              - ${ACCESS_DATA_STORE_OBO_SCOPE:}
        provider:
          azure-entra:
            token-uri: https://login.microsoftonline.com/${AZURE_ENTRA_TENANT_ID:}/oauth2/v2.0/token

management:
  endpoints:
    web:
      base-path: "/"
      path-mapping:
        prometheus: "metrics"
        health: "actuator/health"
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
      # The Kubernetes probes use these groups rather than the full /actuator/health aggregate, so
      # that a downstream outage (e.g. the Legal Framework API) is visible to monitoring without
      # restarting our pods or pulling them out of the load balancer.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

logging:
  level:
    root: ${ROOT_LOGGING_LEVEL:info}
    org.springframework: ${SPRING_LOGGING_LEVEL:info}
    uk.gov.justice: ${APP_LOGGING_LEVEL:info}
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name:default}
        environment: ${spring.profiles.active:default}
        node_name: ${HOSTNAME:unknown}

laa-civil-manage-api:
  access-data-store:
    # Default to the real Access Data Store. Only journeys still backed by the in-process
    # mock need an explicit override below
    default-base-url: ${ACCESS_DATA_STORE_BASE_URL}
    connect-timeout: 3s
    read-timeout: 5s
    operation-base-urls:
      create-draft: http://localhost:8080/mock-access-data-store
      update-draft: http://localhost:8080/mock-access-data-store
      get-draft: http://localhost:8080/mock-access-data-store
      get-drafts: http://localhost:8080/mock-access-data-store
      delete-draft: http://localhost:8080/mock-access-data-store
  legal-framework:
    base-url: ${LEGAL_FRAMEWORK_API_BASE_URL}
    connect-timeout: 3s
    read-timeout: 5s
  notify:
    enabled: ${GOV_UK_NOTIFY_ENABLED:true}
    api-key: ${GOV_UK_NOTIFY_API_KEY:}
    # Only set in test/e2e environments to redirect calls to a WireMock stub instead
    # of the real GOV.UK Notify API. Leave unset in production to use the client's default.
    base-url: ${GOV_UK_NOTIFY_BASE_URL:}
    prior-authority-submitted-template-id: ${GOV_UK_NOTIFY_TEMPLATE_ID:}
    recipient-email: ${GOV_UK_NOTIFY_EMAIL:}
