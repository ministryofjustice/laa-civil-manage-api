name: ZAP Security Scanning
on:
  workflow_call:

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build JAR
        run: ./gradlew build -x test --no-daemon

      - name: Verify JAR exists
        run: |
          echo "Checking for JAR files..."
          JAR_FILE=$(find build/libs -name "laa-civil-manage-api-*.jar" | grep -v plain)
          
          if [ -z "$JAR_FILE" ]; then
            echo "JAR not found! Build may have failed."
            exit 1
          fi
          echo "Found JAR: $JAR_FILE"

      - name: Create tmp directory for ZAP reports
        run: |
          mkdir -p tmp
          chmod 777 tmp

      - name: Run Zap Security Scan against Civil Manage
        run: |
          chmod +x ./deploy/scripts/zap/zap-run-cicd.sh
          ./deploy/scripts/zap/zap-run-cicd.sh 

      - name: Upload ZAP HTML Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-scan-report-html
          path: tmp/zap-baseline-report.html